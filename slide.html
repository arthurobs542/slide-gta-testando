<!DOCTYPE html>
<html lang="pt_br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <title>Slide Gta 6</title>
  </head>
  <body>
    <header>
      <h1>testando</h1>
    </header>
    <main class="flex items-center justify-center min-h-screen bg-gray-500">
      <section
        id="slide-content"
        class="relative w-[90%] max-w-[360px] h-[200px] overflow-hidden rounded-lg"
      >
        <div
          id="slides"
          class="flex transition-transform duration-500 ease-in-out"
        >
          <!-- img1 -->
          <img
            src="./assent/img/Jason_and_Lucia_01_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img2 -->
          <img
            src="./assent/img/Jason_and_Lucia_02_phone_A.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img3 -->

          <img
            src="./assent/img/Jason_and_Lucia_Motel_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />

          <!-- img4 -->
          <img
            src="./assent/img/Brian_Heder_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img5 -->
          <img
            src="./assent/img/Cal_Hampton_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img6 -->
          <img
            src="./assent/img/DreQuan_Priest_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img7 -->

          <img
            src="./assent/img/Boobie_Ike_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img8 -->
          <img
            src="./assent/img/Raul_Bautista_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
          <!-- img9 -->
          <img
            src="./assent/img/Real_Dimez_phone.jpg"
            class="w-full h-full object-cover"
            alt=""
          />
        </div>
        <!-- botoes -->
        <button
          id="prev"
          class="absolute top-1/2 left-2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow-md"
        >
          &#10094;
        </button>

        <button
          id="prox"
          class="absolute top-1/2 right-2 transform -translate-y-1/2 bg-white p-2 rounded-full shadow-md"
        >
          &#10095;
        </button>
      </section>
    </main>

    <script src="./assent/javaScript/script.js"></script>
  </body>
</html>
